version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-music-coach-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musiccoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-musiccoach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musiccoach}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ai-music-coach-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-musiccoach}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-musiccoach}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: